# Comments to be attached to the rendered Google Doc for the dta-review
# (diagnostic test accuracy review) protocol template.
#
# One body (Japanese) is attached to BOTH the ja and en Google Docs, using
# language-specific anchor strings to locate the insertion point in each master.
#
# Schema (one entry per comment):
#   - id:          stable identifier (kebab-case). Required.
#     legacy_id:   (optional) numeric id of the corresponding comment in the
#                  2020-03-04 legacy DTA Doc
#                  (resources/20200304_診断精度SRのプロトコルテンプレ.docx).
#     anchor:      text the comment is anchored to. Must appear verbatim in the body.
#       ja:        Japanese anchor string (matched against the ja master).
#       en:        English anchor string (matched against the en master). Omit to
#                  attach the comment only to the ja Doc.
#     occurrence:  (optional, default 1) which occurrence of the anchor string to attach to.
#     lessons:     (optional) array of training-lesson references, resolved against
#                  resources/training_lessons.json (synced from the SRWS-PSG Slack
#                  training curriculum sheet via tools/sync_training_lessons.py).
#                  Each element is one of:
#                    - a serial prefix: matches any lesson whose serial is exactly
#                      that prefix or starts with "<prefix>_" (segment-boundary
#                      match, so "03_1" does NOT match "03_10").
#                    - "=<serial>": exact serial match, no prefix descent (use when
#                      a prefix would also pull in an unwanted sub-lesson, e.g.
#                      "=10_02_06" below, which would otherwise also pull in the
#                      sibling "10_02_06_02" guideline-authoring lesson).
#                    - "key:<lesson_key>": exact lesson_key match (escape hatch,
#                      unused so far).
#                  At build time (tools/build_gdoc.py) each ref is resolved, then
#                  filtered to released lessons only (serial is not unique in the
#                  sheet -- a lesson can be re-recorded under a new lesson_key while
#                  keeping its old serial -- so this is what disambiguates a
#                  duplicated serial), and rendered as a "related training" block
#                  listing category + serial + title, sorted by serial. The build
#                  fails if a ref resolves to zero lessons, or to lessons that are
#                  all unreleased.
#     legacy_urls: (optional) the original Facebook-group post URL(s) this comment's
#                  `lessons:` entries were migrated from. Kept for provenance only;
#                  never rendered into the comment body. (The SRWS-PSG Facebook
#                  group is private and its posts are stale; see `lessons:` for the
#                  current, linkable equivalent.)
#     body: |
#       Japanese comment text shown in both ja and en Google Docs. Optional when
#       `lessons:` is present, since the block above is generated in full; if both
#       are given, the generated lesson block is rendered first, then a blank line,
#       then this hand-written text.
#     audience:    (optional) free-form tags, e.g. [author, mentor, reference].
#
# Notes:
#   - Anchors target SECTION HEADINGS (which are in English in both ja and en
#     masters) so that ja_anchor == en_anchor for most entries.

comments:
  # --- 1. Introduction --------------------------------------------------
  - id: c-introduction-clinical-pathway-ref
    legacy_id: 0
    anchor:
      ja: "# 1. Introduction"
      en: "# 1. Introduction"
    lessons: ["10_02_01", "10_02_00"]
    legacy_urls:
      - https://www.facebook.com/groups/339218557733680/posts/347107986944737
    audience: [reference]

  # --- 3.2 Inclusion criteria ------------------------------------------
  - id: c-inclusion-ref
    legacy_id: 1
